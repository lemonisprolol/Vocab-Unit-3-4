function question(e,v){const answer=v===3?e.meaning:e.answer;let options=v===3?shuffle(DATA.filter(x=>x.id!==e.id&&x.meaning!==answer)).slice(0,3).map(x=>x.meaning):e.distractors;return {id:e.id,variant:v,answer,options:shuffle([answer,...options]),choice:null,hinted:false}}
function start(mode,u){if(mode==='review'&&!dueEntries(u).length){toast('Không có cụm đến lượt ôn. Bạn có thể luyện nhanh!');return}if(!replaceActive())return;let pool=mode==='review'?dueEntries(u):DATA.filter(e=>!u||e.unit===u);if(mode!=='boss')pool=shuffle(pool).sort((a,b)=>stat(a.id).streak-stat(b.id).streak);else pool=shuffle(pool);begin(mode,u,pool.slice(0,mode==='boss'?20:10))}

function playPage(){const a=state.active;if(!a){go('map');return}const q=current(),e=byId[q.id],answered=q.choice!==null,boss=a.mode==='boss',correct=a.queue.filter(q=>q.choice!==null&&q.options[q.choice]===q.answer).length;$('#screen').innerHTML=`<div class="play-wrap"><div class="play-top"><button class="back" id="pause">← Lưu & về bản đồ</button><span>${boss?'♜ Đấu trường ABCD':a.mode==='review'?'↺ Săn lỗi':a.mode==='lesson'?'✦ Khám phá':'⚔ Luyện nhanh'} · ${a.index+1}/${a.queue.length}</span></div><div class="meter"><i style="width:${a.index/a.queue.length*100}%"></i></div><div class="battle"><div class="fighter"><span>${state.pet}</span><small>Nhà thám hiểm</small></div><div class="battle-msg">${boss?'Bình tĩnh. Đọc kỹ. Chọn đúng.':answered?(q.options[q.choice]===q.answer?'Một bước tiến thật đẹp! ✦':'Thêm một điều để nhớ 🌱'):'Một câu hỏi, một bước khám phá.'}<div style="font-size:11px;font-weight:normal;margin-top:5px">${boss?'Đáp án được giải thích sau khi nộp bài':`${correct} đáp án đúng · Không giới hạn thời gian`}</div></div><div class="fighter"><span>${boss?'🐲':'🍄'}</span><small>${boss?'Rồng thử thách':'Nấm tri thức'}</small></div></div><article class="card question"><span class="eyebrow">${boss?'CHOOSE THE BEST ANSWER':esc(q.variant===3?'Hiểu nghĩa':e.kind)} · UNIT ${e.unit}</span>${q.cloze?`<p style="font-size:16px;line-height:1.9;margin-top:18px">${esc(CLOZE[q.cloze.group].text)}</p>`:''}<h2>${esc(prompt(q)).replace('___','<span style="color:#7e9b57">_____</span>')}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${answered?(boss?(q.choice===i?'selected':''):(o===q.answer?'correct':q.choice===i?'wrong':'')):''}" data-choice="${i}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${q.hinted?`<div class="hint">💡 ${esc(e.rule)} · ${esc(e.meaning)}</div>`:''}${answered&&!boss?explanation(q):''}<div class="question-foot">${!boss&&!answered?`<button class="btn light small" id="hint" ${q.hinted?'disabled':''}>💡 Gợi ý</button>`:`<small>${boss?'Không có gợi ý trong đấu trường.':'Phím A–D để chọn · Enter để tiếp tục'}</small>`}${answered?`<button class="btn" id="next">${a.index===a.queue.length-1?(boss?'Nộp bài ✓':'Hoàn thành ✦'):'Câu tiếp theo →'}</button>`:''}</div></article></div>`;$('#pause').onclick=()=>go('map');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(+b.dataset.choice));if($('#hint'))$('#hint').onclick=()=>{q.hinted=true;save();playPage()};if($('#next'))$('#next').onclick=next}
function explanation(q){const e=byId[q.id],ok=q.options[q.choice]===q.answer;return `<div class="feedback ${ok?'':'bad'}"><b>${ok?'✓ Chính xác!':'↺ Chưa đúng — cùng ghi nhớ nhé.'} Đáp án: ${'ABCD'[q.options.indexOf(q.answer)]}. ${esc(q.answer)}</b><p><strong>${esc(e.term)}</strong> — ${esc(e.meaning)}</p><p>${esc(e.rule)}</p>${q.variant!==3?`<p><i>${esc(q.cloze?CLOZE[q.cloze.group].text.replace(/\((\d)\) ___/g,(_,n)=>DATA.find(e=>e.term===CLOZE[q.cloze.group].terms[+n-1]).answer):e.contexts[q.variant].replace('___',q.answer))}</i></p>`:''}${!ok?`<p style="font-size:12px">Bạn chọn “${esc(q.options[q.choice])}”. ${q.variant===3?'Nghĩa này không khớp với cụm từ được hỏi.':`Trong câu này, cấu trúc cần dùng là “${esc(e.rule)}”; “${esc(q.options[q.choice])}” không phù hợp.`}</p>`:''}${q.hinted?'<small>Đã dùng gợi ý: +3 XP nếu đúng, chưa tính vào độ thành thạo.</small>':''}</div>`}
function recordAnswer(q,mode){const ok=q.options[q.choice]===q.answer,s=stat(q.id),d=day();s.seen++;if(ok){s.correct++;if(!q.hinted){s.streak++;if(!s.contexts.includes(q.variant))s.contexts.push(q.variant);if(!s.dates.includes(d))s.dates.push(d);s.due=Date.now()+[1,3,7,14][Math.min(s.streak-1,3)]*DAY}else{s.due=Date.now()}}else{s.streak=0;s.due=Date.now();s.contexts=[];s.dates=[]}state.stats[q.id]=s;state.xp+=ok?(q.hinted?3:10):0;state.coins+=ok?2:0;const today=state.days[d]||(state.days[d]={answers:0,correct:0,reviews:0});today.answers++;if(ok)today.correct++;if(mode==='review')today.reviews++;}

function next(){const a=state.active;if(!a||current().choice===null)return;if(a.index<a.queue.length-1){a.index++;save();playPage();window.scrollTo({top:0,behavior:'instant'})}else finish()}
function finish(){const a=state.active;if(a.mode==='boss')a.queue.forEach(q=>recordAnswer(q,'boss'));const correct=a.queue.filter(q=>q.options[q.choice]===q.answer).length;lastResult={...a,correct};state.history.unshift({date:new Date().toISOString(),mode:a.mode,unit:a.unit,correct,total:a.queue.length});state.history=state.history.slice(0,100);if(a.lesson)state.lessons[a.lesson]=true;state.coins+=5;state.active=null;save();go('result')}
function resultPage(){if(!lastResult){go('stats');return}const r=lastResult,wrong=r.queue.filter(q=>q.options[q.choice]!==q.answer),xp=r.queue.reduce((n,q)=>n+(q.options[q.choice]===q.answer?(q.hinted?3:10):0),0);$('#screen').innerHTML=`<div class="play-wrap"><div class="card result"><div class="big">${r.correct/r.queue.length>=.8?'🏆':'🌱'}</div><h1>${r.correct/r.queue.length>=.8?'Một chặng thật xuất sắc!':'Thêm một bước tiến bộ.'}</h1><p class="muted">${wrong.length?`${wrong.length} câu cần ôn đã được đưa vào Săn lỗi.`:'Bạn đã vượt qua tất cả câu hỏi trong lượt này.'}</p><div class="result-score">${r.correct}<span style="font-size:24px;color:#9aa38e"> / ${r.queue.length}</span></div><div class="chips"><span class="chip">✦ +${xp} XP</span><span class="chip">🪙 +${r.correct*2+5} vàng</span><span class="chip">✓ Đã lưu tiến độ</span></div><div class="actions" style="justify-content:center"><button class="btn" id="again">${wrong.length?'Ôn lại điểm yếu':'Luyện tiếp'}</button><button class="btn light" id="result-home">Về bản đồ</button></div></div><h3>${r.mode==='boss'?'Đáp án & giải thích toàn bài':'Nhìn lại những câu cần nhớ'}</h3>${(r.mode==='boss'?r.queue:wrong).map((q,i)=>`<div class="card" style="margin-bottom:12px"><b>${i+1}. ${esc(prompt(q))}</b><div class="review-answer">Bạn chọn: ${esc(q.options[q.choice])}</div>${explanation(q)}</div>`).join('')||'<p class="muted">Không có câu sai. Hãy quay lại vào ngày khác để kiểm tra trí nhớ nhé.</p>'}</div>`;$('#again').onclick=()=>start(wrong.length?'review':'practice',r.unit);$('#result-home').onclick=()=>go('map')}
function reviewPage(){const a=dueEntries(),mistakes=DATA.filter(e=>stat(e.id).seen&&stat(e.id).streak===0);$('#screen').innerHTML=`<div class="page-head"><div><h1>Săn lỗi cùng cáo ↺</h1><p class="muted">Sai ở đâu, luyện ở đó. Mỗi lần gặp là một ngữ cảnh khác.</p></div></div><div class="stat-grid"><div class="card stat"><strong>${a.length}</strong><small>Cụm đến lượt ôn</small></div><div class="card stat"><strong>${mistakes.length}</strong><small>Cụm vừa trả lời sai</small></div><div class="card stat"><strong>${metrics().master}</strong><small>Đã kiểm tra lại</small></div><div class="card stat"><strong>${state.history.filter(h=>h.mode==='review').length}</strong><small>Lượt ôn hoàn thành</small></div></div>${a.length?`<div class="card" style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:15px"><div><h3 style="margin:0">Một vòng ôn, một chút vững hơn.</h3><small>Tối đa 10 câu · Ưu tiên cụm vừa sai</small></div><button class="btn" id="start-review">Bắt đầu ↗</button></div><div class="word-grid">${a.map(wordCard).join('')}</div>`:`<div class="card empty"><div class="big">🌿</div><h2>Hôm nay đã nhẹ đầu hơn rồi.</h2><p class="muted">Chưa có cụm cần ôn. Bạn có thể khám phá từ mới hoặc luyện thêm.</p><button class="btn" id="free-practice">Luyện 10 câu mới ↗</button></div>`}`;if($('#start-review'))$('#start-review').onclick=()=>start('review',0);if($('#free-practice'))$('#free-practice').onclick=()=>start('practice',0)}
function wordCard(e){let s=stat(e.id);return `<article class="card word"><div class="state">UNIT ${e.unit} · ${labels[level(e.id)]}</div><div class="term">${esc(e.term)}</div><p>${esc(e.meaning)}</p><div class="rule">${esc(e.rule)}</div><p class="example">${esc(e.contexts[0].replace('___',e.answer))}</p><div class="micro"><span>${s.correct}/${s.seen} lần đúng</span><span>${!s.seen?'Chưa luyện':s.due<=Date.now()?'Đến lượt ôn':`Ôn sau ${Math.max(1,Math.ceil((s.due-Date.now())/DAY))} ngày`}</span></div></article>`}
function wordsPage(){$('#screen').innerHTML=`<div class="page-head"><div><h1>Sổ tay của bạn ▤</h1><p class="muted">48 cụm từ · Tra cứu cấu trúc và xem ví dụ bất cứ lúc nào.</p></div></div><div class="filters"><input type="search" id="search" aria-label="Tìm từ hoặc nghĩa" placeholder="Tìm từ, nghĩa hoặc cấu trúc…"><select id="filter-unit" aria-label="Lọc Unit"><option value="0">Tất cả Unit</option><option value="3">Unit 3</option><option value="4">Unit 4</option></select><select id="filter-kind" aria-label="Lọc dạng"><option value="">Mọi dạng</option>${[...new Set(DATA.map(e=>e.kind))].map(k=>`<option>${k}</option>`).join('')}</select></div><div id="word-list" class="word-grid"></div>`;const filter=()=>{const normalize=s=>s.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'),q=normalize($('#search').value),u=+$('#filter-unit').value,k=$('#filter-kind').value,es=DATA.filter(e=>(!u||e.unit===u)&&(!k||e.kind===k)&&normalize(e.term+' '+e.meaning+' '+e.rule).includes(q));$('#word-list').innerHTML=es.length?es.map(wordCard).join(''):'<p class="muted">Không tìm thấy cụm phù hợp.</p>'};$('#search').oninput=filter;$('#filter-unit').onchange=filter;$('#filter-kind').onchange=filter;filter()}
function statsPage(){let all=Object.values(state.stats),seen=all.reduce((n,s)=>n+s.seen,0),correct=all.reduce((n,s)=>n+s.correct,0),m=metrics();$('#screen').innerHTML=`<div class="page-head"><div><h1>Nhìn lại hành trình ▥</h1><p class="muted">XP ghi nhận nỗ lực. Độ thành thạo ghi nhận khả năng nhớ và dùng.</p></div></div><div class="stat-grid">${[[m.seen+'/48','Cụm đã khám phá'],[seen?Math.round(correct/seen*100)+'%':'—','Đúng trên mọi lần trả lời'],[m.master,'Đã kiểm tra lại'],[state.xp,'XP tích lũy']].map(([n,t])=>`<div class="card stat"><strong>${n}</strong><small>${t}</small></div>`).join('')}</div><div class="settings-grid"><div class="card"><h3>Bản đồ kiến thức</h3>${labels.map((l,i)=>`<div class="summary-row"><span>${l}</span><b>${DATA.filter(e=>level(e.id)===i).length} cụm</b></div>`).join('')}<p class="muted" style="font-size:12px;margin-top:15px">“Đã kiểm tra lại”: đúng không gợi ý ở ít nhất 3 dạng/ngữ cảnh, trên ít nhất 2 ngày, và chuỗi đúng gần nhất ≥ 2. Trả lời sai sẽ đưa cụm về luyện lại.</p></div><div class="card"><h3>Theo dạng câu hỏi</h3>${[...new Set(DATA.map(e=>e.kind))].map(k=>{const ss=DATA.filter(e=>e.kind===k).map(e=>stat(e.id)),n=ss.reduce((n,s)=>n+s.seen,0),c=ss.reduce((n,s)=>n+s.correct,0);return `<div class="summary-row"><span>${k}</span><b>${n?Math.round(c/n*100)+'%':'Chưa luyện'}</b></div>`}).join('')}</div></div><h3 style="margin-top:25px">Những lượt chơi gần đây</h3><div class="card">${state.history.length?state.history.slice(0,10).map(h=>`<div class="summary-row"><span>${new Date(h.date).toLocaleDateString('vi-VN')} · ${{boss:'Đấu trường',review:'Ôn lỗi',lesson:'Khám phá',practice:'Luyện nhanh'}[h.mode]||'Luyện tập'}</span><b>${h.correct}/${h.total}</b></div>`).join(''):'<p class="muted" style="margin:0">Chuyến phiêu lưu đang chờ bạn. Hoàn thành một lượt để xem kết quả ở đây.</p>'}</div>`}
function settingsPage(){$('#screen').innerHTML=`<div class="page-head"><div><h1>Hành trang ⚙</h1><p class="muted">Người bạn đồng hành, phần thưởng và tiến độ của bạn.</p></div><span class="pill">🪙 ${state.coins} vàng</span></div><div class="settings-grid"><div class="card"><h3>Chọn bạn đồng hành</h3><p>Dùng vàng kiếm được qua luyện tập. Cáo luôn sẵn sàng cùng bạn.</p><div class="wardrobe">${[['🦊',0],['🐸',80],['🐼',160]].map(([p,c])=>`<button class="pet ${state.pet===p?'on':''}" data-pet="${p}" data-cost="${c}" ${state.coins<c?'disabled':''}><span>${p}</span><small>${c?`Cần ${c} vàng`:'Miễn phí'}</small></button>`).join('')}</div><p>Vàng là mốc mở khóa; đổi bạn đồng hành không mất vàng.</p></div><div class="card"><h3>Âm thanh</h3><p>Âm báo ngắn khi trả lời. Mặc định tắt để bạn học ở bất cứ đâu.</p><button class="btn light" id="sound">${state.sound?'🔊 Đang bật':'🔇 Đang tắt'}</button></div><div class="card"><h3>Tiến độ luôn theo bạn</h3><p>Tự lưu sau mỗi câu trên <b>trình duyệt và địa chỉ website hiện tại</b>, kể cả lượt đang dở. Chưa đồng bộ tài khoản. Xóa dữ liệu trình duyệt sẽ xóa bản lưu này.</p><div class="actions"><button class="btn" id="export">↓ Xuất bản sao lưu</button><button class="btn light" id="import">↑ Nhập tiến độ</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><p>Dùng xuất/nhập để chuyển giữa điện thoại, máy tính hoặc bản tải về.</p></div><div class="card"><h3>Về nội dung</h3><p>48 cụm trọng tâm từ tài liệu Vocabulary 3–4 bạn cung cấp; 204 câu gồm 48 câu nghĩa, 96 câu luyện, 48 câu boss đơn và 12 câu điền khuyết trong 4 đoạn văn.</p><p>Ví dụ được biên soạn mới. Đây là bộ luyện từ vựng trọng tâm, chưa phải bản chép đầy đủ các trang đọc hiểu và cloze trong ảnh.</p><button class="btn light small" id="reset">Xóa tiến độ trên thiết bị</button></div></div>`;document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{state.pet=b.dataset.pet;save();settingsPage()});$('#sound').onclick=()=>{state.sound=!state.sound;save();sound(true);settingsPage()};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`vocab-quest-progress-${day()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất bản sao lưu tiến độ.')};$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>2000000){toast('Tệp quá lớn. Hãy chọn bản sao lưu Vocab Quest.');return}try{const s=JSON.parse(await f.text());if(!valid(s)||(s.active&&!validActive(s.active)))throw Error();if(confirm('Nhập tệp này sẽ thay thế tiến độ trên thiết bị. Tiếp tục?')){state=s;save();render();toast('Đã khôi phục tiến độ.')}}catch(e){toast('Tệp không hợp lệ. Tiến độ hiện tại được giữ nguyên.')}ev.target.value=''};$('#reset').onclick=()=>{if(confirm('Xóa toàn bộ tiến độ trên thiết bị này? Hãy xuất bản sao lưu trước nếu cần.')){state=initial();save();go('map');toast('Đã bắt đầu hành trình mới.')}}}
document.addEventListener('keydown',e=>{if(page!=='play'||e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;const i=e.key.length===1?'abcd'.indexOf(e.key.toLowerCase()):-1;if(i>=0){e.preventDefault();answer(i)}else if(e.key==='Enter'&&current()?.choice!==null&&e.target.tagName!=='BUTTON'){e.preventDefault();next()}});
window.addEventListener('storage',e=>{if(e.key===KEY){try{const s=JSON.parse(e.newValue);if(valid(s)){state=s;if(!validActive(state.active))state.active=null;render();toast('Đã cập nhật tiến độ từ tab khác.')}}catch(e){}}});
render();
</script></body></html>
